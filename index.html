<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motor City Hockey Drill Builder</title><style>html,body{margin:0;min-height:100%;background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}#load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.spinner{width:42px;height:42px;border:4px solid #333;border-top-color:#d71920;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div id="load"><div><div class="spinner"></div><b>Loading Motor City Hockey Drill Builder…</b><div style="color:#aaa;font-size:12px;margin-top:8px">Loading drill library</div></div></div><script>(async()=>{const parts=[];for(let i=0;i<35;i++){const n=String(i).padStart(3,'0');const r=await fetch('app/chunks/chunk_'+n+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('Missing chunk '+n);parts.push(await r.text());}const full=parts.join('');document.open();document.write(full);document.close();})().catch(err=>{document.getElementById('load').innerHTML='<div><h2>Drill Builder failed to load</h2><p style="color:#bbb">'+String(err)+'</p></div>';});</script></body></html>
