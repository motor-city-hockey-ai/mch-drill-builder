<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motor City Hockey Drill Builder</title>
<style>
html,body{margin:0;min-height:100%;background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
#load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.spinner{width:42px;height:42px;border:4px solid #333;border-top-color:#d71920;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="load"><div><div class="spinner"></div><b>Loading Motor City Hockey Drill Builder…</b><div style="color:#aaa;font-size:12px;margin-top:8px">Loading drill library</div></div></div>
<script>
(async()=>{
  try{
    const urls=Array.from({length:35},(_,i)=>'app/chunks/chunk_'+String(i).padStart(3,'0')+'.txt');
    const parts=await Promise.all(urls.map(async(url)=>{
      const r=await fetch(url+'?v=3',{cache:'no-store'});
      if(!r.ok) throw new Error('Could not load '+url+' ('+r.status+')');
      return r.text();
    }));
    const full=parts.join('');
    if(!full.includes('id="mchSeedData"') || !full.includes('restoreSet();populateQuick();renderCategories();')){
      throw new Error('Drill library package is incomplete.');
    }
    const blob=new Blob([full],{type:'text/html;charset=utf-8'});
    const blobUrl=URL.createObjectURL(blob);
    location.replace(blobUrl);
  }catch(err){
    document.getElementById('load').innerHTML='<div><h2>Drill Builder failed to load</h2><p style="color:#bbb;max-width:680px">'+String(err)+'</p><p style="color:#888;font-size:12px">Please refresh once. If this remains, the drill package needs repair.</p></div>';
  }
})();
</script>
</body>
</html>
