name: Safari Test Drill Source Viewer
on:
  push:
    branches: [fix-safari-and-viewer-text]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps webkit
      - run: |
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          sleep 2
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.webkit.launch(headless=True)
              page=browser.new_page(viewport={"width":1440,"height":1100})

              page.goto("http://127.0.0.1:8000/coaches.html?source=book&v=15",wait_until="domcontentloaded",timeout=120000)
              page.wait_for_selector(".card",timeout=30000)
              print("BOOK_STATUS",page.locator("#status").inner_text())
              imgs=page.locator(".diagram-wrap img")
              page.wait_for_function("""()=>[...document.querySelectorAll('.diagram-wrap img')].slice(0,4).every(i=>i.complete&&i.naturalWidth>100&&i.naturalHeight>60)""",timeout=30000)
              vals=imgs.evaluate_all("""els=>els.slice(0,4).map(i=>({src:i.getAttribute('src'),w:i.naturalWidth,h:i.naturalHeight}))""")
              print("BOOK_IMAGES",vals)
              assert len(vals)>=4 and all(v["w"]>100 and v["h"]>60 for v in vals)
              assert vals[0]["src"].endswith("hdb-0001.png")

              page.locator(".view").first.click()
              page.wait_for_selector("#viewer.open",timeout=10000)
              page.wait_for_function("""()=>{const i=document.querySelector('#bigImage');return !i.hidden&&i.complete&&i.naturalWidth>100}""",timeout=10000)
              book_desc=page.locator("#vdesc").inner_text()
              frame_src=page.locator("#sourceFrame").get_attribute("src")
              print("BOOK_VIEWER_DESC",book_desc)
              print("BOOK_FRAME",frame_src)
              assert "original drill instructions" in book_desc.lower()
              assert "#page=30" in frame_src

              page.goto("http://127.0.0.1:8000/coaches.html?source=coaches&v=15",wait_until="domcontentloaded",timeout=120000)
              page.wait_for_selector(".card",timeout=30000)
              print("COACHES_STATUS",page.locator("#status").inner_text())
              page.locator(".view").first.click()
              page.wait_for_selector("#viewer.open",timeout=10000)
              desc=page.locator("#vdesc").inner_text()
              cframe=page.locator("#sourceFrame").get_attribute("src")
              print("COACHES_DESC",desc)
              print("COACHES_FRAME",cframe)
              assert "Run a 5-on-3 offensive-zone possession sequence" in desc
              assert "#page=3" in cframe
              browser.close()
          PY
