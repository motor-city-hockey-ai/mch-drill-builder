name: Build Hockey Drill Book Images
on:
  push:
    branches: [fix-safari-and-viewer-text]
    paths:
      - scripts/build_hockey_book_images.py
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-safari-and-viewer-text
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf requests
      - run: python scripts/build_hockey_book_images.py
      - name: Commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hockey-drill-book/hockey-drill-book.json data/hockey-drill-book/images
          git diff --cached --quiet && exit 0
          git commit -m "Render Hockey Drill Book diagrams for Safari"
          git push origin HEAD:fix-safari-and-viewer-text
