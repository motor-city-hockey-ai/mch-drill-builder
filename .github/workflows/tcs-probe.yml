name: TCS PDF Probe
on:
  push:
    branches: [tcs-real-diagram-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf requests
      - run: python scripts/tcs_probe.py
