name: Build Hockey Drill Book Library
on:
  push:
    branches: [hockey-drill-book-library]
    paths:
      - scripts/inspect_hockey_drill_book.py
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hockey-drill-book-library
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf requests
      - run: python scripts/inspect_hockey_drill_book.py
      - name: Commit generated library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hockey-drill-book/hockey-drill-book.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate Hockey Drill Book drill metadata"
          git push origin HEAD:hockey-drill-book-library
