name: Inspect Hockey Drill Book
on:
  push:
    branches: [hockey-drill-book-library]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf requests
      - run: python scripts/inspect_hockey_drill_book.py
