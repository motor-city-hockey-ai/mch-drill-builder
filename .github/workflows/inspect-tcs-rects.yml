name: Inspect TCS Diagram Rects
on:
  push:
    branches: [render-original-tcs-diagrams]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf requests
      - run: python scripts/inspect_tcs_rects.py
