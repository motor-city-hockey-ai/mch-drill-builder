<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motor City Hockey - Staff Assignment Builder</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
:root{--red:#e51b23;--black:#090909;--ink:#171717;--muted:#707070;--line:#d9d9d9;--wash:#f5f5f5;--green:#1b8b4a;--blue:#1f72b4}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:#ededed;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:1600px;margin:0 auto;background:#fff;min-height:100vh}
.header{background:#080808;color:#fff;border-bottom:5px solid var(--red);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:54px;height:54px;object-fit:contain}.brand h1{margin:0;font-size:25px;line-height:1.05}.brand small{display:block;margin-top:4px;color:#bbb;letter-spacing:1.6px;font-size:10px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:900;min-height:40px}.btn.red{background:var(--red);color:#fff}.btn.dark{background:#292929;color:#fff}.btn.light{background:#eee;color:#111}.btn.outline{background:#fff;border:1px solid #bbb;color:#111}
.main{padding:20px 24px 54px}
.toolbar{background:#111;color:#fff;border-left:5px solid var(--red);border-radius:15px;padding:14px 16px;margin-bottom:12px}
.toolbar-grid{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr auto auto;gap:9px;align-items:end}
.field label{display:block;font-size:9px;letter-spacing:1.15px;font-weight:900;color:#bbb;margin-bottom:5px}.control{width:100%;height:43px;border:1px solid #555;border-radius:8px;background:#171717;color:#fff;padding:0 10px;min-width:0}
.format-tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}.format-tab{flex:0 0 auto;border:1px solid #ccc;border-radius:999px;background:#fff;padding:8px 13px;font-weight:900}.format-tab.active{background:#111;color:#fff;border-color:#111}
.top-tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.notice{background:#f5f5f5;border-left:4px solid var(--green);border-radius:8px;padding:9px 11px;margin-bottom:14px;font-size:12px}
.skate{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff;margin:0 0 18px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
.skate-head{background:#111;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.skate-title{font-weight:900;font-size:17px}.skate-sub{font-size:11px;color:#aaa;margin-top:3px}.xbtn{width:33px;height:33px;border:0;border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:17px}
.skate-meta{display:grid;grid-template-columns:1.15fr .75fr 1fr 1.05fr auto;gap:8px;padding:11px 12px;background:#f7f7f7;border-bottom:1px solid #ddd;align-items:end}.meta-field label{display:block;font-size:9px;font-weight:900;letter-spacing:1px;color:#777;margin-bottom:4px}.meta-field input,.meta-field select{width:100%;height:37px;border:1px solid #c8c8c8;border-radius:8px;background:#fff;padding:0 8px}
.skate-body{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(330px,.72fr);gap:14px;padding:12px}
.diagram-panel{min-width:0;border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#fafafa}.diagram-tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:8px;background:#eee;border-bottom:1px solid #ddd}.diagram-tools .hint{font-size:10px;color:#666;margin-left:auto}
.rink-wrap{position:relative;background:#fff;aspect-ratio:3/2;min-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden}.rink-svg{display:block;width:100%;height:100%}.rink-watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16%;max-width:150px;opacity:.18;filter:grayscale(1);pointer-events:none;z-index:1}
.station-layer{position:absolute;inset:0;pointer-events:none;z-index:3}.station-tag{position:absolute;transform:translate(-50%,-50%);background:#111;color:#fff;border:1px solid #fff;border-radius:2px;padding:3px 5px;font-size:9px;font-weight:900;line-height:1;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:auto;cursor:move;touch-action:none}
.zone-label{position:absolute;transform:translate(-50%,-50%);font-family:Georgia,serif;font-size:11px;color:#d5252f;white-space:nowrap;pointer-events:none;z-index:2}
.side-panel{display:flex;flex-direction:column;gap:10px;min-width:0}.section{border:1px solid #ddd;border-radius:11px;padding:10px;background:#fff}.section h3{margin:0 0 7px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}.section-sub{font-size:10px;color:#777;margin:-3px 0 8px}
.assignment-head{display:grid;grid-template-columns:minmax(100px,1fr) minmax(100px,.85fr) minmax(100px,.85fr) 28px;gap:5px;font-size:8px;color:#888;font-weight:900;text-transform:uppercase;letter-spacing:.7px;padding:0 0 4px}
.assign-row{display:grid;grid-template-columns:minmax(100px,1fr) minmax(100px,.85fr) minmax(100px,.85fr) 28px;gap:5px;align-items:center;padding:5px 0;border-bottom:1px solid #eee;position:relative}.assign-row:last-child{border-bottom:0}.row-label{width:100%;height:32px;border:0;background:#fff;padding:0 4px;font-size:11px;font-weight:800}.assign-row select,.assign-row .custom-wrap input{width:100%;height:32px;border:1px solid #bbb;border-radius:7px;background:#fff;padding:0 6px;font-size:10px}.small-x{width:27px;height:27px;border:0;border-radius:50%;background:#eee;color:#a00;font-weight:900}
.assign-wrap.custom .custom-wrap{display:block}.custom-wrap{display:none;margin-top:3px}
.section-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.section-tools .btn{padding:7px 9px;min-height:31px;font-size:10px}
.notes-area{width:100%;min-height:76px;border:1px solid #bbb;border-radius:7px;padding:7px;font-size:11px;resize:vertical}
.staff-admin{border:1px solid #ddd;border-radius:12px;padding:11px;background:#fafafa;margin-top:14px}.staff-admin h3{margin:0 0 6px;font-size:14px}.staff-groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.staff-group{background:#fff;border:1px solid #ddd;border-radius:9px;padding:8px}.staff-group h4{margin:0 0 6px;font-size:10px}.staff-list{display:flex;flex-wrap:wrap;gap:5px}.staff-chip{border:1px solid #ccc;border-radius:999px;background:#fff;padding:5px 7px;font-size:9px;display:flex;align-items:center;gap:5px}.staff-chip button{border:0;background:none;color:#a00;font-weight:900;padding:0}
.staff-add{display:grid;grid-template-columns:1fr 170px auto;gap:7px;margin-top:9px}.staff-add input,.staff-add select{height:37px;border:1px solid #bbb;border-radius:8px;background:#fff;padding:0 8px}
.mobile-sticky{display:none}
@media(max-width:1180px){
 .toolbar-grid{grid-template-columns:1fr 1fr 1fr}.skate-body{grid-template-columns:1fr}.side-panel{display:grid;grid-template-columns:1fr 1fr}.rink-wrap{min-height:340px}.staff-groups{grid-template-columns:1fr 1fr}
}
@media(max-width:820px){
 .header{padding:14px}.brand h1{font-size:21px}.brand img{width:46px;height:46px}.main{padding:14px 11px 78px}.toolbar{padding:12px}.toolbar-grid{grid-template-columns:1fr 1fr}.skate-meta{grid-template-columns:1fr 1fr}.side-panel{grid-template-columns:1fr}.rink-wrap{min-height:300px}.assignment-head,.assign-row{grid-template-columns:minmax(95px,1fr) minmax(90px,.9fr) minmax(90px,.9fr) 28px}.staff-groups{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
 .header{flex-direction:column;align-items:stretch}.header-actions{display:grid;grid-template-columns:1fr 1fr}.header-actions .btn{width:100%}.brand h1{font-size:19px}.brand small{font-size:9px}
 .toolbar-grid{grid-template-columns:1fr}.skate-meta{grid-template-columns:1fr}.skate-body{padding:7px}.rink-wrap{min-height:0;aspect-ratio:3/2}.rink-watermark{width:19%}.diagram-tools .btn{flex:1 1 43%;font-size:10px;padding:8px}.diagram-tools .hint{width:100%;margin:0}
 .station-tag{font-size:7px;padding:2px 3px}.zone-label{font-size:8px}
 .assignment-head{display:none}.assign-row{grid-template-columns:1fr 1fr;padding-right:34px}.row-label{grid-column:1/-1;border:1px solid #ddd;border-radius:7px;padding:0 7px}.assign-row .small-x{position:absolute;right:0;top:28px}.staff-groups{grid-template-columns:1fr}.staff-add{grid-template-columns:1fr}
 .mobile-sticky{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:100;grid-template-columns:1fr 1fr;gap:7px;background:#111;border-top:3px solid var(--red);padding:7px 9px calc(7px + env(safe-area-inset-bottom))}.mobile-sticky .btn{width:100%}
}
@media print{
 html,body{background:#fff}.app{max-width:none}.header{padding:9px 12px}.brand img{width:40px;height:40px}.brand h1{font-size:19px}.header-actions,.toolbar,.format-tabs,.top-tools,.notice,.diagram-tools,.staff-admin,.xbtn,.small-x,.edit-only,.mobile-sticky{display:none!important}
 .main{padding:7px}.skate{box-shadow:none;border:1px solid #aaa;break-inside:avoid;margin-bottom:9px}.skate-head{padding:7px 9px}.skate-meta{display:none}.skate-body{grid-template-columns:1.42fr .58fr;padding:7px;gap:7px}.rink-wrap{min-height:0;aspect-ratio:3/2}.section{padding:6px}.section h3{font-size:10px}.assignment-head{display:none}.assign-row{grid-template-columns:1fr 92px 92px;padding:3px 0;gap:4px}.assign-row select,.assign-row input,.notes-area{border:0!important;height:auto;padding:0;font-size:8px}.station-tag{font-size:7px;padding:2px 3px}
}
.pdf-mode .edit-only,.pdf-mode .toolbar,.pdf-mode .format-tabs,.pdf-mode .top-tools,.pdf-mode .notice,.pdf-mode .diagram-tools,.pdf-mode .staff-admin,.pdf-mode .xbtn,.pdf-mode .small-x,.pdf-mode .mobile-sticky{display:none!important}
.pdf-mode .main{padding:9px}.pdf-mode .skate{box-shadow:none}.pdf-mode .skate-meta{display:none}.pdf-mode .skate-body{grid-template-columns:1.42fr .58fr}.pdf-mode .assign-row select,.pdf-mode .assign-row input,.pdf-mode .notes-area{border:0!important;background:#fff!important}
</style>
</head>
<body>
<div class="app">
<header class="header">
 <div class="brand"><img src="assets/mch-logo.png" alt="Motor City Hockey"><div><h1>MOTOR CITY HOCKEY</h1><small>STAFF ASSIGNMENT BUILDER</small></div></div>
 <div class="header-actions edit-only">
  <button class="btn dark" id="saveBtn">Save</button>
  <button class="btn dark" id="backupBtn">Backup</button>
  <button class="btn dark" id="restoreBtn">Restore</button>
  <button class="btn red" id="pdfBtn">Export PDF</button>
  <input id="restoreFile" type="file" accept="application/json" hidden>
 </div>
</header>
<main class="main">
 <section class="toolbar edit-only">
  <div class="toolbar-grid">
   <div class="field"><label>FORMAT</label><select class="control" id="formatSelect"></select></div>
   <div class="field"><label>FORMAT NAME</label><input class="control" id="formatName"></div>
   <div class="field"><label>DATE / LABEL</label><input class="control" id="dateLabel" placeholder="e.g. Monday, Oct. 5"></div>
   <div class="field"><label>NEW FORMAT BASE</label><select class="control" id="presetSelect"><option value="monday">Monday Training</option><option value="camp">Camp Formats</option><option value="standard">Standard Ice</option><option value="blank">Blank Custom</option></select></div>
   <button class="btn light" id="addFormatBtn">+ Format</button>
   <button class="btn red" id="addSkateBtn">+ Skate</button>
  </div>
 </section>
 <div class="format-tabs edit-only" id="formatTabs"></div>
 <div class="top-tools edit-only"><button class="btn light" id="duplicateFormatBtn">Duplicate Current Format</button><button class="btn light" id="deleteFormatBtn">Delete Current Format</button></div>
 <div class="notice edit-only"><b>Coach names start blank.</b> The staff list only feeds the dropdowns. Diagram layouts now match your rink formats with the bumpers built into the ice.</div>
 <div id="content"></div>

 <section class="staff-admin edit-only">
  <h3>Staff List</h3>
  <div class="section-sub">Names are available in dropdowns but are never assigned automatically.</div>
  <div class="staff-groups" id="staffGroups"></div>
  <div class="staff-add"><input id="newStaff" placeholder="Add coach / staff name"><select id="newStaffGroup"><option>Managers</option><option>Adult Lead Coaches</option><option>Student Coaches</option><option>Fill-In / Last Resort</option><option>Summer Only</option><option>Added Staff</option></select><button class="btn dark" id="addStaffBtn">Add Staff</button></div>
 </section>
</main>
</div>
<div class="mobile-sticky edit-only"><button class="btn dark" id="mobileSave">Save</button><button class="btn red" id="mobilePdf">Export PDF</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(()=>{
const STORAGE='mch-staff-duties-v3';
const DEFAULT_GROUPS={
 'Managers':['Rich Mihelic','Nick Spinale'],
 'Adult Lead Coaches':['Mitch Hall','Reid Marshall','Luke Peck','Ary Batra'],
 'Student Coaches':['Anthony Delpup','Austin Combs','Mikayla Ratliff','Max Neill','Chase Dewey','Luke Forrest','Jack Gentz','Patrick Macks'],
 'Fill-In / Last Resort':['Alex Kosaian','Connor Inger','Joe Patterson','Jake Pobur','Vinny Recchia','Joe Aiello','Zeke Landis','Evan Komarowski','Liam Neill'],
 'Summer Only':['Mitch Lewandowski','Corey Schultheis','Blake Tosto'],
 'Added Staff':[]
};
const staffDefault=[...new Set(Object.values(DEFAULT_GROUPS).flat())];
const uid=(p='x')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const LAYOUTS={
 'blank':{
  name:'Blank Rink - No Bumpers',bumpers:[],zoneLabels:[],
  stations:[]
 },
 'monday-split':{
  name:'Monday Split - In-House + Advanced',
  bumpers:[[179,165,11,53],[179,390,11,53],[266,291,53,11],[569,176,11,54],[567,363,11,54],[696,294,53,11]],
  zoneLabels:[['IN-HOUSE ZONES',382,280],['ADVANCED TRAINING',646,283]],
  stations:[
   ['IN-HOUSE STATION 1',104,109],['IN-HOUSE STATION 2',439,107],['IN-HOUSE STATION 3',430,316],['IN-HOUSE STATION 4',75,353],
   ['ADV STATION 1',708,101],['ADV STATION 2',719,337]
  ]
 },
 'monday-rink-b':{
  name:'Monday 7:05 Rink B - 3 Stations',
  bumpers:[[445,148,11,54],[445,410,11,53],[568,163,11,54],[564,377,11,54],[644,294,54,12]],
  zoneLabels:[],
  stations:[['STATION 1',697,108],['STATION 2',702,332],['STATION 3',505,106]]
 },
 'camp-8':{
  name:'Camp - 8 Zone',
  bumpers:[[262,175,11,53],[256,387,12,53],[142,303,54,11],[309,302,54,12],[443,172,11,54],[440,393,12,54],[505,305,54,11],[629,172,12,53],[632,389,11,53],[688,304,53,11]],
  zoneLabels:[],
  stations:[['STATION 1',125,99],['STATION 2',340,99],['STATION 3',533,99],['STATION 4',748,99],['STATION 5',748,336],['STATION 6',547,336],['STATION 7',360,341],['STATION 8',167,344]]
 },
 'camp-6':{
  name:'Camp - 6 Station',
  bumpers:[[323,143,11,53],[324,395,11,53],[148,289,54,11],[445,148,11,54],[445,410,11,53],[568,163,11,54],[564,377,11,54],[644,294,54,12]],
  zoneLabels:[],
  stations:[['STATION 1',169,104],['STATION 2',390,108],['STATION 3',514,106],['STATION 4',712,101],['STATION 5',699,502],['STATION 6',168,500]]
 },
 'camp-split':{
  name:'Camp Split - 3 Zones Each',
  bumpers:[[324,170,11,54],[323,372,12,54],[138,290,53,11],[445,253,12,54],[564,156,12,53],[567,383,11,53],[704,288,53,11]],
  zoneLabels:[['6U / 8U IN-HOUSE 3 ZONES',333,267],['ADVANCED SIDE 3 ZONES',585,266]],
  stations:[['IN-HOUSE STATION 1',182,100],['IN-HOUSE STATION 2',377,108],['IN-HOUSE STATION 3',143,505],['ADV STATION 1',514,101],['ADV STATION 2',731,99],['ADV STATION 3',731,505]]
 },
 'custom':{name:'Custom Uploaded Diagram',bumpers:[],zoneLabels:[],stations:[]}
};

function rinkSvg(layoutKey){
 const spec=LAYOUTS[layoutKey]||LAYOUTS.blank;
 const b=spec.bumpers.map(r=>'<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="#111"/>').join('');
 return '<svg class="rink-svg" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" aria-label="'+esc(spec.name)+'">'+
 '<rect width="900" height="600" fill="#fff"/>'+
 '<path d="M87 86 H813 C854 86 887 119 887 160 V449 C887 490 854 523 813 523 H87 C46 523 13 490 13 449 V160 C13 119 46 86 87 86 Z" fill="#fff" stroke="#222" stroke-width="2"/>'+
 '<line x1="73" y1="88" x2="73" y2="521" stroke="#ed1c24" stroke-width="2"/><line x1="829" y1="88" x2="829" y2="521" stroke="#ed1c24" stroke-width="2"/>'+
 '<line x1="330" y1="87" x2="330" y2="522" stroke="#2175b9" stroke-width="4"/><line x1="571" y1="87" x2="571" y2="522" stroke="#2175b9" stroke-width="4"/>'+
 '<line x1="450" y1="87" x2="450" y2="522" stroke="#ed1c24" stroke-width="5"/>'+
 faceoffCircle(162,208)+faceoffCircle(162,397)+faceoffCircle(741,208)+faceoffCircle(741,397)+
 '<circle cx="354" cy="209" r="5" fill="#ed1c24"/><circle cx="549" cy="209" r="5" fill="#ed1c24"/><circle cx="354" cy="398" r="5" fill="#ed1c24"/><circle cx="549" cy="398" r="5" fill="#ed1c24"/>'+
 '<path d="M73 277 A27 27 0 0 1 73 331 Z" fill="#61c5e5" stroke="#ed1c24" stroke-width="2"/><path d="M829 277 A27 27 0 0 0 829 331 Z" fill="#61c5e5" stroke="#ed1c24" stroke-width="2"/>'+
 b+'</svg>';
}
function faceoffCircle(cx,cy){
 return '<g stroke="#ed1c24" fill="none" stroke-width="2"><circle cx="'+cx+'" cy="'+cy+'" r="65"/><line x1="'+(cx-12)+'" y1="'+cy+'" x2="'+(cx+12)+'" y2="'+cy+'"/><line x1="'+cx+'" y1="'+(cy-12)+'" x2="'+cx+'" y2="'+(cy+12)+'"/><line x1="'+(cx-10)+'" y1="'+(cy-75)+'" x2="'+(cx-10)+'" y2="'+(cy-64)+'"/><line x1="'+(cx+10)+'" y1="'+(cy-75)+'" x2="'+(cx+10)+'" y2="'+(cy-64)+'"/><line x1="'+(cx-10)+'" y1="'+(cy+64)+'" x2="'+(cx-10)+'" y2="'+(cy+75)+'"/><line x1="'+(cx+10)+'" y1="'+(cy+64)+'" x2="'+(cx+10)+'" y2="'+(cy+75)+'"/></g><circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#ed1c24"/>';
}
function stationRowsFor(layoutKey){
 const spec=LAYOUTS[layoutKey]||LAYOUTS.blank;
 return spec.stations.map((s,i)=>({id:uid('st'),label:s[0],x:s[1]/9,y:s[2]/6,coach1:'',coach2:'',custom1:'',custom2:''}));
}
function mkAssign(label){return {id:uid('a'),label,coach1:'',coach2:'',custom1:'',custom2:''};}
function mkSection(title,labels=[]){return {id:uid('sec'),title,rows:labels.map(mkAssign)};}
function mkSkate(title,time,location,layoutKey='blank',extra={}){
 return {id:uid('k'),title,time,location,layoutKey,customImage:'',showLabels:true,
  stations:stationRowsFor(layoutKey),
  duties:(extra.duties||['Puck Lap Post Skate','Equipment Bin To Rink Location','Equipment Bin Back to Location','Puck Bag']).map(mkAssign),
  sections:extra.sections||[],notes:''
 };
}
function mondayFormat(id='monday',name='Monday Training'){
 return {id,name,dateLabel:'',skates:[
  mkSkate('Monday 6:10 PM','6:10 PM','Rink C','monday-split',{duties:['Equipment Chest To Rink','Pucks To Rink','Zone Changes','Little Nets / Setup']}),
  mkSkate('Monday 7:05 PM','7:05 PM','Rink C','monday-split',{duties:['Equipment Back To Coaches Room','Pucks Back To Coaches Room','Zone Changes','Little Nets / Setup']}),
  mkSkate('Monday 7:05 PM - Rink B','7:05 PM','Rink B','monday-rink-b',{duties:['Pucks','Equipment','Goalie / Nets']})
 ]};
}
function campFormat(id='camp',name='Camp Formats'){
 return {id,name,dateLabel:'',skates:[
  mkSkate('8 Zone Camp','','','camp-8',{duties:['Pucks','Equipment','Zone Changes']}),
  mkSkate('6 Station Camp','','','camp-6',{duties:['Pucks','Equipment','Zone Changes']}),
  mkSkate('3 Zones Each - In-House / Advanced','','','camp-split',{duties:['Pucks','Equipment','Zone Changes']})
 ]};
}
function standardFormat(id=uid('fmt'),name='Standard Ice'){return {id,name,dateLabel:'',skates:[mkSkate('Training Skate','','','blank')]};}
function blankFormat(id=uid('fmt'),name='Custom Format'){return {id,name,dateLabel:'',skates:[mkSkate('New Assignment Block','','','blank',{duties:[]})]};}
function baseState(){
 const monday=mondayFormat(),camp=campFormat();
 return {staff:[...staffDefault],staffGroups:JSON.parse(JSON.stringify(DEFAULT_GROUPS)),activeFormat:'monday',formats:{monday,camp}};
}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'null');if(x&&x.formats&&x.staff)return x;}catch(e){}return baseState();}
let state=load();

function persist(msg=true){localStorage.setItem(STORAGE,JSON.stringify(state));if(msg)flash('Saved.');}
function flash(t){const n=document.querySelector('.notice');if(!n)return;const old=n.innerHTML;n.innerHTML='<b>'+esc(t)+'</b>';setTimeout(()=>n.innerHTML=old,1400);}
function active(){return state.formats[state.activeFormat];}
function allSkates(){return Object.values(state.formats).flatMap(f=>f.skates||[]);}
function getSkate(id){return allSkates().find(s=>s.id===id);}
function staffGroupFor(name){for(const [g,names] of Object.entries(state.staffGroups||{}))if((names||[]).includes(name))return g;return 'Added Staff';}
function staffSorted(group=null){let a=[...new Set(state.staff||[])];if(group)a=a.filter(n=>staffGroupFor(n)===group);return a.sort((x,y)=>{const xl=x.trim().split(/\s+/).slice(-1)[0],yl=y.trim().split(/\s+/).slice(-1)[0];return xl.localeCompare(yl)||x.localeCompare(y);});}
function coachOptions(val){
 let out='<option value="">- Select Coach -</option>';
 ['Managers','Adult Lead Coaches','Student Coaches','Summer Only','Fill-In / Last Resort','Added Staff'].forEach(g=>{const names=staffSorted(g);if(!names.length)return;out+='<optgroup label="'+esc(g)+'">'+names.map(n=>'<option value="'+esc(n)+'" '+(n===val?'selected':'')+'>'+esc(n)+'</option>').join('')+'</optgroup>';});
 return out+'<option value="__custom__" '+(val==='__custom__'?'selected':'')+'>Custom Name...</option>';
}
function assignmentSelect(value,custom,attrs='',slot='1'){
 return '<div class="assign-wrap '+(value==='__custom__'?'custom':'')+'"><select '+attrs+' data-slot="'+slot+'">'+coachOptions(value)+'</select><div class="custom-wrap"><input '+attrs+' data-custom-slot="'+slot+'" value="'+esc(custom||'')+'" placeholder="Type name"></div></div>';
}
function renderFormats(){
 const ids=Object.keys(state.formats);
 formatSelect.innerHTML=ids.map(id=>'<option value="'+esc(id)+'" '+(id===state.activeFormat?'selected':'')+'>'+esc(state.formats[id].name)+'</option>').join('');
 formatTabs.innerHTML=ids.map(id=>'<button class="format-tab '+(id===state.activeFormat?'active':'')+'" data-format="'+esc(id)+'">'+esc(state.formats[id].name)+'</button>').join('');
 formatTabs.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{state.activeFormat=b.dataset.format;persist(false);render();});
}
function renderStaff(){
 const groups=['Managers','Adult Lead Coaches','Student Coaches','Summer Only','Fill-In / Last Resort','Added Staff'];
 staffGroups.innerHTML=groups.map(g=>'<div class="staff-group"><h4>'+esc(g)+'</h4><div class="staff-list">'+staffSorted(g).map(n=>'<span class="staff-chip">'+esc(n)+'<button data-del-staff="'+esc(n)+'">x</button></span>').join('')+'</div></div>').join('');
 staffGroups.querySelectorAll('[data-del-staff]').forEach(b=>b.onclick=()=>{const n=b.dataset.delStaff;if(!confirm('Remove '+n+' from the staff list?'))return;state.staff=state.staff.filter(x=>x!==n);Object.values(state.staffGroups).forEach(a=>{const i=a.indexOf(n);if(i>=0)a.splice(i,1);});persist(false);render();});
}
function layoutOptions(selected){
 return Object.entries(LAYOUTS).map(([k,v])=>'<option value="'+k+'" '+(k===selected?'selected':'')+'>'+esc(v.name)+'</option>').join('');
}
function layoutVisual(skate){
 const tags='<div class="station-layer">'+(skate.showLabels?skate.stations.map(st=>'<span class="station-tag" data-marker="'+esc(st.id)+'" data-skate-id="'+esc(skate.id)+'" style="left:'+Number(st.x)+'%;top:'+Number(st.y)+'%">'+esc(st.label.replace(/^IN-HOUSE |^ADV /,''))+'</span>').join(''):'')+'</div>';
 if(skate.layoutKey==='custom'&&skate.customImage){
  return '<img src="'+skate.customImage+'" alt="Custom rink diagram" style="width:100%;height:100%;object-fit:contain">'+tags;
 }
 const spec=LAYOUTS[skate.layoutKey]||LAYOUTS.blank;
 return rinkSvg(skate.layoutKey)+'<img class="rink-watermark" src="assets/mch-logo.png" alt="">'+
  (skate.showLabels?spec.zoneLabels.map(z=>'<span class="zone-label" style="left:'+(z[1]/9)+'%;top:'+(z[2]/6)+'%">'+esc(z[0])+'</span>').join(''):'')+tags;
}
function assignmentHeader(){return '<div class="assignment-head"><span>Assignment</span><span>Coach 1</span><span>Coach 2</span><span></span></div>';}
function assignRow(row,kind,skateId,sectionId=''){
 const common='data-kind="'+kind+'" data-row-id="'+esc(row.id)+'" data-skate-id="'+esc(skateId)+'" '+(sectionId?'data-section-id="'+esc(sectionId)+'"':'');
 return '<div class="assign-row"><input class="row-label" '+common+' data-field="label" value="'+esc(row.label)+'">'+assignmentSelect(row.coach1,row.custom1,common+' data-field="coach"','1')+assignmentSelect(row.coach2,row.custom2,common+' data-field="coach"','2')+'<button class="small-x edit-only" '+common+' data-del-row="1">x</button></div>';
}
function sectionHtml(skate,sec){
 return '<section class="section"><h3><input data-section-title="'+esc(sec.id)+'" data-skate-id="'+esc(skate.id)+'" value="'+esc(sec.title)+'" style="width:100%;border:0;background:transparent;font-weight:900"><button class="small-x edit-only" data-del-section="'+esc(sec.id)+'" data-skate-id="'+esc(skate.id)+'">x</button></h3>'+assignmentHeader()+sec.rows.map(r=>assignRow(r,'section',skate.id,sec.id)).join('')+'<div class="section-tools edit-only"><button class="btn light" data-add-row="'+esc(sec.id)+'" data-skate-id="'+esc(skate.id)+'">+ Row</button></div></section>';
}
function metaInput(label,value,field,id){return '<div class="meta-field"><label>'+esc(label)+'</label><input data-skate-field="'+esc(field)+'" data-skate-id="'+esc(id)+'" value="'+esc(value||'')+'"></div>';}
function skateHtml(skate){
 return '<article class="skate"><div class="skate-head"><div><div class="skate-title">'+esc(skate.title)+'</div><div class="skate-sub">'+esc([skate.time,skate.location].filter(Boolean).join(' - '))+'</div></div><button class="xbtn edit-only" data-remove-skate="'+esc(skate.id)+'">x</button></div>'+
 '<div class="skate-meta edit-only">'+metaInput('Title',skate.title,'title',skate.id)+metaInput('Time',skate.time,'time',skate.id)+metaInput('Location',skate.location,'location',skate.id)+'<div class="meta-field"><label>DIAGRAM LAYOUT</label><select data-layout="'+esc(skate.id)+'">'+layoutOptions(skate.layoutKey)+'</select></div><div><button class="btn light" data-toggle-labels="'+esc(skate.id)+'">'+(skate.showLabels?'Hide Labels':'Show Labels')+'</button></div></div>'+
 '<div class="skate-body"><div class="diagram-panel"><div class="diagram-tools edit-only"><button class="btn dark" data-blank-rink="'+esc(skate.id)+'">Blank Rink</button><label class="btn dark">Upload Diagram<input type="file" accept="image/*" data-upload="'+esc(skate.id)+'" hidden></label><button class="btn light" data-reset-layout="'+esc(skate.id)+'">Reset Layout</button><span class="hint">The black bumpers are part of the rink layout. Coach names stay off the diagram.</span></div><div class="rink-wrap" data-frame="'+esc(skate.id)+'">'+layoutVisual(skate)+'</div></div>'+
 '<aside class="side-panel"><section class="section"><h3>Station Assignments</h3><div class="section-sub">All coach fields intentionally start blank.</div>'+assignmentHeader()+skate.stations.map(r=>assignRow(r,'station',skate.id)).join('')+'<div class="section-tools edit-only"><button class="btn light" data-add-station="'+esc(skate.id)+'">+ Station</button></div></section>'+
 '<section class="section"><h3>Skate Duties</h3>'+assignmentHeader()+skate.duties.map(r=>assignRow(r,'duty',skate.id)).join('')+'<div class="section-tools edit-only"><button class="btn light" data-add-duty="'+esc(skate.id)+'">+ Duty</button></div></section>'+
 skate.sections.map(sec=>sectionHtml(skate,sec)).join('')+
 '<section class="section"><h3>Notes</h3><textarea class="notes-area" data-notes="'+esc(skate.id)+'" placeholder="Coach notes, timing, equipment, locker room details...">'+esc(skate.notes||'')+'</textarea><div class="section-tools edit-only"><button class="btn light" data-add-section="'+esc(skate.id)+'">+ Assignment Section</button></div></section></aside></div></article>';
}
function getRow(skate,kind,rowId,sectionId){
 if(kind==='station')return skate.stations.find(x=>x.id===rowId);
 if(kind==='duty')return skate.duties.find(x=>x.id===rowId);
 const sec=skate.sections.find(x=>x.id===sectionId);return sec&&sec.rows.find(x=>x.id===rowId);
}
function resetStations(skate,layoutKey){skate.layoutKey=layoutKey;skate.customImage='';skate.stations=stationRowsFor(layoutKey);skate.showLabels=true;}
function bind(){
 document.querySelectorAll('[data-skate-field]').forEach(el=>el.oninput=()=>{const s=getSkate(el.dataset.skateId);s[el.dataset.skateField]=el.value;persist(false);renderHeadersOnly();});
 document.querySelectorAll('[data-remove-skate]').forEach(b=>b.onclick=()=>{const f=active();if(f.skates.length<=1){alert('A format needs at least one assignment block.');return;}f.skates=f.skates.filter(x=>x.id!==b.dataset.removeSkate);persist(false);render();});
 document.querySelectorAll('[data-layout]').forEach(sel=>sel.onchange=()=>{const s=getSkate(sel.dataset.layout);if(sel.value==='custom'){s.layoutKey='custom';s.stations=[];}else resetStations(s,sel.value);persist(false);render();});
 document.querySelectorAll('[data-toggle-labels]').forEach(b=>b.onclick=()=>{const s=getSkate(b.dataset.toggleLabels);s.showLabels=!s.showLabels;persist(false);render();});
 document.querySelectorAll('[data-blank-rink]').forEach(b=>b.onclick=()=>{resetStations(getSkate(b.dataset.blankRink),'blank');persist(false);render();});
 document.querySelectorAll('[data-reset-layout]').forEach(b=>b.onclick=()=>{const s=getSkate(b.dataset.resetLayout);if(s.layoutKey==='custom'){s.customImage='';s.stations=[];}else resetStations(s,s.layoutKey);persist(false);render();});
 document.querySelectorAll('[data-upload]').forEach(inp=>inp.onchange=async()=>{const file=inp.files&&inp.files[0];if(!file)return;const s=getSkate(inp.dataset.upload);s.layoutKey='custom';s.customImage=await compressImage(file);s.stations=[];s.showLabels=true;persist(false);render();});
 document.querySelectorAll('[data-add-station]').forEach(b=>b.onclick=()=>{const s=getSkate(b.dataset.addStation);s.stations.push({id:uid('st'),label:'STATION '+(s.stations.length+1),x:50,y:50,coach1:'',coach2:'',custom1:'',custom2:''});persist(false);render();});
 document.querySelectorAll('[data-add-duty]').forEach(b=>b.onclick=()=>{getSkate(b.dataset.addDuty).duties.push(mkAssign('New Duty'));persist(false);render();});
 document.querySelectorAll('[data-add-section]').forEach(b=>b.onclick=()=>{getSkate(b.dataset.addSection).sections.push(mkSection('New Assignment Section',['New Assignment']));persist(false);render();});
 document.querySelectorAll('[data-add-row]').forEach(b=>b.onclick=()=>{const s=getSkate(b.dataset.skateId),sec=s.sections.find(x=>x.id===b.dataset.addRow);if(sec)sec.rows.push(mkAssign('New Assignment'));persist(false);render();});
 document.querySelectorAll('[data-section-title]').forEach(el=>el.oninput=()=>{const s=getSkate(el.dataset.skateId),sec=s.sections.find(x=>x.id===el.dataset.sectionTitle);if(sec){sec.title=el.value;persist(false);}});
 document.querySelectorAll('[data-del-section]').forEach(b=>b.onclick=()=>{const s=getSkate(b.dataset.skateId);s.sections=s.sections.filter(x=>x.id!==b.dataset.delSection);persist(false);render();});
 document.querySelectorAll('[data-field]').forEach(el=>{const fn=()=>{const s=getSkate(el.dataset.skateId),r=getRow(s,el.dataset.kind,el.dataset.rowId,el.dataset.sectionId);if(!r)return;if(el.dataset.field==='label')r.label=el.value;else{const slot=el.dataset.slot||el.dataset.customSlot||'1';if(el.dataset.customSlot)r['custom'+slot]=el.value;else r['coach'+slot]=el.value;}persist(false);};el.oninput=fn;el.onchange=fn;});
 document.querySelectorAll('[data-del-row]').forEach(b=>b.onclick=()=>{const s=getSkate(b.dataset.skateId);if(b.dataset.kind==='station')s.stations=s.stations.filter(x=>x.id!==b.dataset.rowId);else if(b.dataset.kind==='duty')s.duties=s.duties.filter(x=>x.id!==b.dataset.rowId);else{const sec=s.sections.find(x=>x.id===b.dataset.sectionId);if(sec)sec.rows=sec.rows.filter(x=>x.id!==b.dataset.rowId);}persist(false);render();});
 document.querySelectorAll('[data-notes]').forEach(t=>t.oninput=()=>{getSkate(t.dataset.notes).notes=t.value;persist(false);});
 bindDrag();
}
function bindDrag(){
 document.querySelectorAll('.station-tag').forEach(tag=>{
  let drag=false,frame=null,skate=null,station=null;
  const start=e=>{drag=true;frame=tag.closest('.rink-wrap');skate=getSkate(tag.dataset.skateId);station=skate.stations.find(x=>x.id===tag.dataset.marker);e.preventDefault();};
  const move=e=>{if(!drag||!station)return;const r=frame.getBoundingClientRect(),p=e.touches?e.touches[0]:e;station.x=Math.max(3,Math.min(97,(p.clientX-r.left)/r.width*100));station.y=Math.max(4,Math.min(96,(p.clientY-r.top)/r.height*100));tag.style.left=station.x+'%';tag.style.top=station.y+'%';};
  const end=()=>{if(drag){drag=false;persist(false);}};
  tag.addEventListener('mousedown',start);tag.addEventListener('touchstart',start,{passive:false});window.addEventListener('mousemove',move);window.addEventListener('touchmove',move,{passive:false});window.addEventListener('mouseup',end);window.addEventListener('touchend',end);
 });
}
async function compressImage(file){
 const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file);});
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=data;});
 const max=1400,scale=Math.min(1,max/img.width,max/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82);
}
function renderHeadersOnly(){const f=active();formatName.value=f.name||'';dateLabel.value=f.dateLabel||'';requestHeight();}
function render(){
 renderFormats();renderStaff();const f=active();formatName.value=f.name||'';dateLabel.value=f.dateLabel||'';content.innerHTML=f.skates.map(skateHtml).join('');bind();requestHeight();
}
function requestHeight(){setTimeout(()=>{try{parent.postMessage({type:'mch-staff-builder-height',height:document.documentElement.scrollHeight},'*');}catch(e){}},80);}
function regenerateIds(f){f.id=uid('fmt');f.skates.forEach(s=>{s.id=uid('k');s.stations.forEach(r=>r.id=uid('st'));s.duties.forEach(r=>r.id=uid('a'));s.sections.forEach(sec=>{sec.id=uid('sec');sec.rows.forEach(r=>r.id=uid('a'));});});return f;}

saveBtn.onclick=()=>persist(true);mobileSave.onclick=()=>saveBtn.click();
formatSelect.onchange=()=>{state.activeFormat=formatSelect.value;persist(false);render();};
formatName.oninput=()=>{active().name=formatName.value;persist(false);renderFormats();};
dateLabel.oninput=()=>{active().dateLabel=dateLabel.value;persist(false);};
addFormatBtn.onclick=()=>{const p=presetSelect.value,name=prompt('Format name',p==='monday'?'Monday Training':p==='camp'?'Camp Formats':p==='blank'?'Custom Format':'Standard Ice');if(!name)return;let f=p==='monday'?mondayFormat(uid('fmt'),name):p==='camp'?campFormat(uid('fmt'),name):p==='blank'?blankFormat(uid('fmt'),name):standardFormat(uid('fmt'),name);state.formats[f.id]=f;state.activeFormat=f.id;persist(false);render();};
addSkateBtn.onclick=()=>{active().skates.push(mkSkate('New Skate','','','blank'));persist(false);render();};
duplicateFormatBtn.onclick=()=>{const c=regenerateIds(JSON.parse(JSON.stringify(active())));c.name=c.name+' Copy';state.formats[c.id]=c;state.activeFormat=c.id;persist(false);render();};
deleteFormatBtn.onclick=()=>{const ids=Object.keys(state.formats);if(ids.length<=1){alert('Keep at least one format.');return;}if(!confirm('Delete '+active().name+'?'))return;delete state.formats[state.activeFormat];state.activeFormat=Object.keys(state.formats)[0];persist(false);render();};
backupBtn.onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mch-staff-assignment-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);};
restoreBtn.onclick=()=>restoreFile.click();
restoreFile.onchange=async()=>{const file=restoreFile.files&&restoreFile.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!x.formats||!x.staff)throw new Error();state=x;persist(false);render();flash('Backup restored.');}catch(e){alert('That backup file could not be read.');}};
addStaffBtn.onclick=()=>{const n=newStaff.value.trim(),g=newStaffGroup.value;if(!n)return;if(!state.staff.includes(n))state.staff.push(n);Object.values(state.staffGroups).forEach(a=>{const i=a.indexOf(n);if(i>=0)a.splice(i,1);});state.staffGroups[g]=state.staffGroups[g]||[];state.staffGroups[g].push(n);newStaff.value='';persist(false);render();};

pdfBtn.onclick=async()=>{
 persist(false);const {jsPDF}=window.jspdf||{};if(!window.html2canvas||!jsPDF){window.print();return;}
 document.body.classList.add('pdf-mode');
 try{
  const target=document.querySelector('.app'),canvas=await html2canvas(target,{scale:1.65,useCORS:true,backgroundColor:'#fff',windowWidth:1500});
  const pdf=new jsPDF('p','pt','letter'),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),margin=18,imgW=pw-margin*2,pageH=ph-margin*2,imgH=canvas.height*(imgW/canvas.width);
  let pos=0;while(pos<imgH){const srcY=Math.round(pos*(canvas.width/imgW)),slice=Math.min(canvas.height-srcY,Math.round(pageH*(canvas.width/imgW))),c=document.createElement('canvas');c.width=canvas.width;c.height=slice;c.getContext('2d').drawImage(canvas,0,srcY,canvas.width,slice,0,0,c.width,c.height);if(pos>0)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.91),'JPEG',margin,margin,imgW,c.height*(imgW/c.width));pos+=pageH;}
  const safe=((active().dateLabel||active().name||'Staff-Assignments')+'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');pdf.save('Motor-City-Hockey-'+safe+'.pdf');
 }catch(e){console.error(e);window.print();}finally{document.body.classList.remove('pdf-mode');requestHeight();}
};
mobilePdf.onclick=()=>pdfBtn.click();
window.addEventListener('resize',requestHeight,{passive:true});
render();
})();
</script>
</body>
</html>
