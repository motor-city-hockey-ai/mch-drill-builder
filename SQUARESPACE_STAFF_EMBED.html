<!-- Motor City Hockey Staff Assignment Builder - Squarespace Code Block -->
<div id="mch-staff-builder-wrap" style="width:100%;max-width:1600px;margin:0 auto;overflow:hidden;">
  <iframe
    id="mch-staff-builder"
    src="https://motor-city-hockey-ai.github.io/mch-drill-builder/staff-duties.html?embed=1"
    title="Motor City Hockey Staff Assignment Builder"
    loading="eager"
    style="display:block;width:100%;height:1600px;border:0;background:#fff;overflow:hidden;"
    allow="clipboard-write"
  ></iframe>
</div>
<script>
(function(){
  var frame=document.getElementById('mch-staff-builder');
  if(!frame)return;
  window.addEventListener('message',function(event){
    if(event.origin!=='https://motor-city-hockey-ai.github.io')return;
    if(!event.data||event.data.type!=='mch-staff-builder-height')return;
    var h=Math.max(700,Math.min(12000,Number(event.data.height)||1600));
    frame.style.height=h+'px';
  });
  function setWidth(){
    frame.style.width='100%';
    frame.style.maxWidth='100%';
  }
  window.addEventListener('resize',setWidth,{passive:true});
  setWidth();
})();
</script>
