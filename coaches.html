function renderSelected(){$('#count').textContent=selected.length;$('#selected').innerHTML=selected.length?selected.map(d=>'<div class="sel"><button class="x" data-x="'+esc(d.uid)+'">×</button><img src="'+esc(d.image)+'"><b>Drill '+esc(d.number)+' — '+esc(d.title)+'</b></div>').join(''):'<span style="color:#aaa;font-size:12px;padding:6px 0">Your selected drills stay pinned here.</span>';document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{selected=selected.filter(x=>x.uid!==b.dataset.x);save();renderSelected();render()})}
function render(){const all=filtered(),rows=all.slice(0,limit);$('#status').textContent='Loaded '+all.length+' Coaches Site drills.';$('#grid').innerHTML=rows.length?rows.map(d=>'<article class="card"><button class="add" data-add="'+esc(d.uid)+'">'+(chosen(d.uid)?'✓':'+')+'</button><button class="hit" data-open="'+esc(d.uid)+'"><img loading="lazy" src="'+esc(d.image)+'"></button><div class="meta"><div class="num">Drill '+esc(d.number)+'</div><div class="title">'+esc(d.title)+'</div><div class="small">'+esc(d.category)+' · '+esc(d.author||'The Coaches Site')+'</div></div></article>').join(''):'<div class="empty">No drills match this search.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(data.find(d=>d.uid===b.dataset.open)));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();const d=data.find(x=>x.uid===b.dataset.add);if(chosen(d.uid))selected=selected.filter(x=>x.uid!==d.uid);else selected.push({...d,includeDescription:false});save();renderSelected();render()});$('#more').hidden=rows.length>=all.length;$('#all').hidden=rows.length>=all.length}
function open(d){if(!d)return;current=d;$('#vnum').textContent='Drill '+d.number;$('#vtitle').textContent=d.title;$('#vcat').textContent=d.category||'';$('#vimg').src=d.image;$('#vdesc').textContent=d.description||'No written instructions included.';$('#vsource').textContent=[d.source,d.author,d.source_collection,d.source_page?'Page '+d.source_page:''].filter(Boolean).join(' · ');$('#viewer').classList.add('open');document.body.style.overflow='hidden'}
function close(){current=null;$('#viewer').classList.remove('open');document.body.style.overflow=''}
$('#close').onclick=close;$('#vdone').onclick=close;$('#viewer').onclick=e=>{if(e.target===$('#viewer'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function addCurrent(notes){if(!current)return;selected=selected.filter(x=>x.uid!==current.uid);selected.push({...current,includeDescription:notes});save();renderSelected();render();close()}
$('#vadd').onclick=()=>addCurrent(false);$('#vaddnotes').onclick=()=>addCurrent(true);
$('#category').onchange=()=>{limit=36;render()};$('#search').oninput=()=>{limit=36;render()};$('#more').onclick=()=>{limit+=36;render()};$('#all').onclick=()=>{limit=filtered().length;render()};$('#clear').onclick=()=>{selected=[];save();renderSelected();render()};
$('#library').onchange=()=>{const v=$('#library').value;if(v==='team')location.href='index.html?library=team&v=7';else if(v==='travel')location.href='index.html?library=travel&v=7'};
$('#print').onclick=()=>{if(!selected.length)return alert('Select at least one drill first.');const w=window.open('','_blank');if(!w)return alert('Allow pop-ups for this page.');const cards=selected.map(d=>'<section style="border:1px solid #aaa;padding:7px;break-inside:avoid"><b>Drill '+esc(d.number)+' — '+esc(d.title)+'</b><img src="'+d.image+'" style="width:100%;height:3.1in;object-fit:contain">'+(d.includeDescription?'<div style="font-size:9px">'+esc(d.description||'')+'</div>':'')+'</section>').join('');w.document.write('<!doctype html><html><head><style>@page{size:letter landscape;margin:.25in}body{font-family:Arial}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}</style></head><body><div class="g">'+cards+'</div><script>setTimeout(()=>window.print(),700)<\/script></body></html>');w.document.close()};
renderSelected();render();
})();
</script>
</body></html>
